
services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: enterprise-rag-backend

    env_file:
      - .env

    environment:
      PYTHONPATH: /app/backend
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/app/chroma_db
      - document_data:/app/data/documents

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: enterprise-rag-frontend

    environment:
      API_BASE_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  chroma_data:
  document_data:
